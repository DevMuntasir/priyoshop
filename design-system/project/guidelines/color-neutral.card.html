<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .row { display: flex; padding: 20px; }
  .sw { flex: 1; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; }
  .sw span { font-size: 11px; font-weight: 600; line-height: 1.35; }
  .sw .hex { opacity: .7; font-weight: 400; }
  .b { box-shadow: inset 0 0 0 1px var(--ps-grey-200); }
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--ps-black);color:#fff"><span>black</span><span class="hex">#000000</span></div>
  <div class="sw" style="background:var(--ps-ink-700);color:#fff"><span>ink-700</span><span class="hex">#292A2E</span></div>
  <div class="sw" style="background:var(--ps-ink-500);color:#fff"><span>ink-500</span><span class="hex">#545558</span></div>
  <div class="sw" style="background:var(--ps-ink-300);color:#fff"><span>ink-300</span><span class="hex">#8A8A8A</span></div>
  <div class="sw" style="background:var(--ps-grey-200);color:#333"><span>grey-200</span><span class="hex">#E6E6E6</span></div>
  <div class="sw b" style="background:var(--ps-grey-100);color:#333"><span>grey-100</span><span class="hex">#F8F8F8</span></div>
  <div class="sw b" style="background:var(--ps-white);color:#333"><span>white</span><span class="hex">#FFFFFF</span></div>
</div>
</body></html>
