<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base unit" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .wrap { padding: 24px 32px; display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--ps-red-500); width: 100%; border-radius: 4px; }
  .item span { font-size: 11px; color: var(--ps-ink-400); font-weight: 600; }
</style></head>
<body>
<div class="wrap">
  <div class="item" style="width:16px"><div class="bar" style="height:var(--space-2)"></div><span>2</span></div>
  <div class="item" style="width:20px"><div class="bar" style="height:var(--space-4)"></div><span>4</span></div>
  <div class="item" style="width:28px"><div class="bar" style="height:var(--space-5)"></div><span>5</span></div>
  <div class="item" style="width:34px"><div class="bar" style="height:var(--space-6)"></div><span>6</span></div>
  <div class="item" style="width:42px"><div class="bar" style="height:var(--space-7)"></div><span>7</span></div>
  <div class="item" style="width:50px"><div class="bar" style="height:var(--space-8)"></div><span>8</span></div>
  <div class="item" style="width:64px"><div class="bar" style="height:var(--space-9)"></div><span>9</span></div>
  <div class="item" style="width:80px"><div class="bar" style="height:var(--space-10)"></div><span>10</span></div>
</div>
</body></html>
