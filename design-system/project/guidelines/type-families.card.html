<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; color: var(--ps-ink-700); }
  .wrap { padding: 22px 32px; display: flex; gap: 40px; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .big { font-size: 44px; line-height: 1; }
  .name { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--ps-ink-700); }
  .use { font-family: var(--font-body); font-size: 12px; color: var(--ps-ink-300); }
</style></head>
<body>
<div class="wrap">
  <div class="col"><span class="big" style="font-family:var(--font-display);font-weight:800">Aa Bd</span><span class="name">Lato</span><span class="use">Display / headlines</span></div>
  <div class="col"><span class="big" style="font-family:var(--font-body);font-weight:600">Aa Bd</span><span class="name">Open Sans</span><span class="use">Body / UI / buttons</span></div>
  <div class="col"><span class="big" style="font-family:var(--font-accent);font-weight:500">Aa Bd</span><span class="name">Parkinsans</span><span class="use">Accent (rare)</span></div>
</div>
</body></html>
