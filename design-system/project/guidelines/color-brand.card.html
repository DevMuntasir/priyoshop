<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .row { display: flex; padding: 20px; gap: 0; }
  .sw { flex: 1; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box; }
  .sw span { font-size: 12px; font-weight: 600; line-height: 1.4; }
  .sw .hex { opacity: .75; font-weight: 400; }
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--ps-red-50);color:#A12131"><span>red-50</span><span class="hex">#FFF1F3</span></div>
  <div class="sw" style="background:var(--ps-red-100);color:#A12131"><span>red-100</span><span class="hex">#FFE0E4</span></div>
  <div class="sw" style="background:var(--ps-red-500);color:#fff"><span>red-500 ◆</span><span class="hex">#EE2F47</span></div>
  <div class="sw" style="background:var(--ps-red-600);color:#fff"><span>red-600</span><span class="hex">#D92B41</span></div>
  <div class="sw" style="background:var(--ps-red-700);color:#fff"><span>red-700</span><span class="hex">#BE2639</span></div>
  <div class="sw" style="background:var(--ps-red-900);color:#fff"><span>red-900</span><span class="hex">#A12131</span></div>
</div>
</body></html>
