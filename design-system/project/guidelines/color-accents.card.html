<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .row { display: flex; padding: 20px; gap: 0; }
  .sw { flex: 1; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; color: #333; }
  .sw span { font-size: 11px; font-weight: 600; line-height: 1.35; }
  .sw .hex { opacity: .7; font-weight: 400; }
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--ps-peach)"><span>peach</span><span class="hex">#FFE4D1</span></div>
  <div class="sw" style="background:var(--ps-mint)"><span>mint</span><span class="hex">#CEFFDC</span></div>
  <div class="sw" style="background:var(--ps-green-tint)"><span>green-tint</span><span class="hex">#E2F5E8</span></div>
  <div class="sw" style="background:var(--ps-periwinkle)"><span>periwinkle</span><span class="hex">#C8D6FF</span></div>
  <div class="sw" style="background:var(--ps-purple);color:#fff"><span>purple</span><span class="hex">#C5A8FF</span></div>
  <div class="sw" style="background:var(--ps-cyan)"><span>cyan</span><span class="hex">#CAFBFF</span></div>
  <div class="sw" style="background:var(--ps-lime)"><span>lime</span><span class="hex">#F1FFC7</span></div>
  <div class="sw" style="background:var(--ps-gold-500)"><span>gold</span><span class="hex">#FFB700</span></div>
</div>
</body></html>
