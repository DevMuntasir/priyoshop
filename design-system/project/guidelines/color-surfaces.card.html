<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: #fff; }
  .wrap { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 14px; padding: 20px; }
  .tile { height: 130px; border-radius: 16px; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .tile span { font-size: 12px; font-weight: 600; color: #292A2E; }
</style></head>
<body>
<div class="wrap">
  <div class="tile" style="background:var(--ps-gradient-hero)"><span>--ps-gradient-hero</span></div>
  <div class="tile" style="background:var(--ps-warm-white)"><span>warm-white</span></div>
  <div class="tile" style="background:var(--ps-cream)"><span>cream</span></div>
</div>
</body></html>
