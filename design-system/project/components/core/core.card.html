<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: #fff; font-family: var(--font-body); }
  .wrap { padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .row.dark { background: #000; padding: 16px; border-radius: 16px; }
  .lbl { font-size: 13px; font-weight: 600; color: var(--ps-ink-300); width: 96px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script type="text/babel">
  const { Button, Badge, Icon, PlayIcon, IconButton } = window.PriyoShopDesignSystem_0fb1f5;
  function Demo() {
    return (
      <>
        <div className="row">
          <span className="lbl">Filled</span>
          <Button>Join Us</Button>
          <Button tone="brand">Download App</Button>
          <Button size="sm">Learn More</Button>
          <Button size="lg" iconRight={<Icon name="arrow-right" />}>Get Started</Button>
        </div>
        <div className="row">
          <span className="lbl">Outlined</span>
          <Button variant="outlined" iconRight={<PlayIcon />}>Watch Our Story</Button>
          <Button variant="outlined" tone="brand">Contact Sales</Button>
          <Button variant="ghost">Read All Blogs</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div className="row dark">
          <span className="lbl" style={{ color: 'rgba(255,255,255,.6)' }}>On dark</span>
          <Button tone="light">Join Us</Button>
          <Button tone="light" variant="outlined">Contact Us</Button>
        </div>
        <div className="row">
          <span className="lbl">Badges</span>
          <Badge>Ecosystem at a Glance</Badge>
          <Badge tone="brand" variant="soft">New</Badge>
          <Badge tone="gold" variant="solid">Featured</Badge>
        </div>
        <div className="row">
          <span className="lbl">Icon btns</span>
          <IconButton ariaLabel="prev" variant="outline"><Icon name="arrow-left" /></IconButton>
          <IconButton ariaLabel="next" variant="outline"><Icon name="arrow-right" /></IconButton>
          <IconButton ariaLabel="play" tone="brand" variant="filled"><PlayIcon variant="filled" /></IconButton>
          <IconButton ariaLabel="add" variant="filled"><Icon name="plus" /></IconButton>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
