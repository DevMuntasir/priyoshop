<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--ps-warm-white); }
  .wrap { padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .tile { border-radius: 16px; overflow: hidden; background: #fff; box-shadow: var(--ring-card); aspect-ratio: 16/11; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style></head>
<body>
<div class="wrap">
  <div class="tile"><img src="../assets/illustrations/shop-storefront.png" alt="Storefront" /></div>
  <div class="tile"><img src="../assets/illustrations/ecosystem-a.png" alt="Ecosystem" /></div>
  <div class="tile"><img src="../assets/illustrations/mobile-app.png" alt="Mobile app" /></div>
</div>
</body></html>
